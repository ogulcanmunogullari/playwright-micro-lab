name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
        env:
          STORAGE_STATE_PATH_SAUCE: playwright/.auth/saucedemo-user.json
          SAUCEDEMO_BASE_URL: https://www.saucedemo.com
          SAUCEDEMO_USER: ${{ secrets.SAUCEDEMO_USER }}
          SAUCEDEMO_PASS: ${{ secrets.SAUCEDEMO_PASS }}
          STORAGE_STATE_PATH_HEROKUAPP: playwright/.auth/herokuapp-user.json
          HEROKUAPP_BASE_URL: https://the-internet.herokuapp.com
          HEROKU_USER: ${{ secrets.HEROKU_USER }}
          HEROKU_PASS: ${{ secrets.HEROKU_PASS }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
